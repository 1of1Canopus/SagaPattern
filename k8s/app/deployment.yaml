apiVersion: apps/v1
kind: Deployment
metadata:
  name: saga-pattern
  namespace: saga-pattern
spec:
  replicas: 1
  selector:
    matchLabels:
      app: saga-pattern
  template:
    metadata:
      labels:
        app: saga-pattern
    spec:
      containers:
        - name: saga-pattern
          image: housedevinci/saga-pattern:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: saga-pattern-config
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
