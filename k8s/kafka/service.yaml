apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: saga-pattern
spec:
  selector:
    app: kafka
  ports:
    - name: broker
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093
  clusterIP: None  # headless — required for StatefulSet DNS
